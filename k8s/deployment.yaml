apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-backend
  labels:
    app: dms
    component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dms
      component: backend
  template:
    metadata:
      labels:
        app: dms
        component: backend
    spec:
      containers:
      - name: backend
        image: dms-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: database-url
        - name: MQTT_BROKER
          value: "mqtt-service"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-frontend
  labels:
    app: dms
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms
      component: frontend
  template:
    metadata:
      labels:
        app: dms
        component: frontend
    spec:
      containers:
      - name: frontend
        image: dms-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-backend-service
spec:
  selector:
    app: dms
    component: backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: dms-frontend-service
spec:
  selector:
    app: dms
    component: frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dms-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dms-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
